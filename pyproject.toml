[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-web-typer"
version = "1.0.0"
authors = [{ name = "Cyril Gendarme", email = "cyrilgendarme@email.com" }]
keywords = ["webtyper", "dom observer", "autotyper", "autoclicker", "python"]
requires-python = ">=3.9"
dependencies = [
    "selenium>=4.11",
    "psutil>=6.0",
    "keyboard",
    "pyautogui",
    "PyQt6",
    "pygetwindow; platform_system == 'Windows'",
    "pywin32; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["."]
